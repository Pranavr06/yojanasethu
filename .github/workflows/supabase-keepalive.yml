name: Supabase Free-Tier Keepalive

on:
  schedule:
    # Runs automatically every 5 days at 00:00 UTC (prevents Supabase 7-day auto-pause)
    - cron: '0 0 */5 * *'
  workflow_dispatch: # Allows manual 1-click trigger from GitHub Actions tab

jobs:
  ping-supabase:
    name: Ping Supabase Database & Auth API
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Execute Supabase Keepalive Heartbeat
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: node scripts/keepalive.js
