name: Supabase Free-Tier Keepalive

on:
  schedule:
    # Runs twice every day at 06:00 and 18:00 UTC (11:30 AM & 11:30 PM IST)
    # Supabase pauses projects with < 7 days of daily database queries.
    - cron: '0 6,18 * * *'
  workflow_dispatch: # Allows manual 1-click trigger from GitHub Actions tab

jobs:
  ping-supabase:
    name: Ping Supabase Database & Auth API
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Execute Supabase Keepalive Heartbeat
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
        run: node scripts/keepalive.js
